services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-legalmetrix}
      MYSQL_USER: ${MYSQL_USER:-legalmetrix}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-this-local-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-this-local-root-password}
    ports:
      - "3306:3306"
    volumes:
      - legalmetrix-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  legalmetrix-mysql:
